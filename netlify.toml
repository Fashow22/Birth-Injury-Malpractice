[build]
  command = "npm install --no-audit --no-fund && npm run build:css"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Explicit force 301s: Netlify will not parse /*.html (splat cannot sit
# in the middle of a path) and that pattern does not shadow existing files.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

